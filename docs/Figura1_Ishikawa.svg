<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" width="1500" height="880" font-family="Georgia, 'Times New Roman', serif"><rect width="1500" height="880" fill="#ffffff"/><defs><marker id="ar" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#1F3864"/></marker></defs><text x="60" y="46" font-size="24" font-weight="bold" fill="#1F3864">Figura 1. Diagrama de causa y efecto (Ishikawa)</text><text x="60" y="74" font-size="16" fill="#444">Gestión de los servicios de soporte técnico prepago de Innovasoft</text><line x1="60" y1="430" x2="1180" y2="430" stroke="#1F3864" stroke-width="4" marker-end="url(#ar)"/><rect x="1192" y="358" width="272" height="144" rx="8" fill="#1F3864"/><text x="1328" y="396" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">Gestión dispersa</text><text x="1328" y="426" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">y no trazable de los</text><text x="1328" y="456" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">servicios de soporte</text><text x="1328" y="486" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">técnico prepago</text><line x1="320" y1="430" x2="150" y2="130" stroke="#2E5A88" stroke-width="3"/><rect x="25" y="82" width="250" height="38" rx="6" fill="#D9E2F3" stroke="#1F3864" stroke-width="1.5"/><text x="150" y="107" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle">MÉTODO (procesos)</text><line x1="279.2" y1="358" x2="293.2" y2="358" stroke="#2E5A88" stroke-width="2"/><text x="299.2" y="363" font-size="14" fill="#1a1a1a">Sin procedimiento estándar de registro</text><line x1="236.7" y1="283" x2="250.7" y2="283" stroke="#2E5A88" stroke-width="2"/><text x="256.7" y="288" font-size="14" fill="#1a1a1a">Sin acuerdos de nivel de servicio</text><line x1="194.2" y1="208" x2="208.2" y2="208" stroke="#2E5A88" stroke-width="2"/><text x="214.2" y="213" font-size="14" fill="#1a1a1a">Cierre de soporte sin documento formal</text><line x1="620" y1="430" x2="450" y2="130" stroke="#2E5A88" stroke-width="3"/><rect x="325" y="82" width="250" height="38" rx="6" fill="#D9E2F3" stroke="#1F3864" stroke-width="1.5"/><text x="450" y="107" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle">MEDIOS (tecnología)</text><line x1="579.2" y1="358" x2="593.2" y2="358" stroke="#2E5A88" stroke-width="2"/><text x="599.2" y="363" font-size="14" fill="#1a1a1a">Sin plataforma centralizada</text><line x1="536.7" y1="283" x2="550.7" y2="283" stroke="#2E5A88" stroke-width="2"/><text x="556.7" y="288" font-size="14" fill="#1a1a1a">Hojas de cálculo y mensajería</text><line x1="494.2" y1="208" x2="508.2" y2="208" stroke="#2E5A88" stroke-width="2"/><text x="514.2" y="213" font-size="14" fill="#1a1a1a">Sin control de acceso por rol</text><line x1="920" y1="430" x2="750" y2="130" stroke="#2E5A88" stroke-width="3"/><rect x="625" y="82" width="250" height="38" rx="6" fill="#D9E2F3" stroke="#1F3864" stroke-width="1.5"/><text x="750" y="107" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle">MEDICIÓN</text><line x1="879.2" y1="358" x2="893.2" y2="358" stroke="#2E5A88" stroke-width="2"/><text x="899.2" y="363" font-size="14" fill="#1a1a1a">Sin indicadores de tiempo de respuesta</text><line x1="836.7" y1="283" x2="850.7" y2="283" stroke="#2E5A88" stroke-width="2"/><text x="856.7" y="288" font-size="14" fill="#1a1a1a">Consumo de puntos no auditable</text><line x1="794.2" y1="208" x2="808.2" y2="208" stroke="#2E5A88" stroke-width="2"/><text x="814.2" y="213" font-size="14" fill="#1a1a1a">No se compara facturado vs. prestado</text><line x1="320" y1="430" x2="150" y2="730" stroke="#2E5A88" stroke-width="3"/><rect x="25" y="740" width="250" height="38" rx="6" fill="#D9E2F3" stroke="#1F3864" stroke-width="1.5"/><text x="150" y="765" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle">MANO DE OBRA (personas)</text><line x1="279.2" y1="502" x2="293.2" y2="502" stroke="#2E5A88" stroke-width="2"/><text x="299.2" y="507" font-size="14" fill="#1a1a1a">El registro depende de cada asesor</text><line x1="236.7" y1="577" x2="250.7" y2="577" stroke="#2E5A88" stroke-width="2"/><text x="256.7" y="582" font-size="14" fill="#1a1a1a">El estado del caso vive en la memoria</text><line x1="194.2" y1="652" x2="208.2" y2="652" stroke="#2E5A88" stroke-width="2"/><text x="214.2" y="657" font-size="14" fill="#1a1a1a">Sin visibilidad de la carga de trabajo</text><line x1="620" y1="430" x2="450" y2="730" stroke="#2E5A88" stroke-width="3"/><rect x="325" y="740" width="250" height="38" rx="6" fill="#D9E2F3" stroke="#1F3864" stroke-width="1.5"/><text x="450" y="765" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle">MATERIALES (información)</text><line x1="579.2" y1="502" x2="593.2" y2="502" stroke="#2E5A88" stroke-width="2"/><text x="599.2" y="507" font-size="14" fill="#1a1a1a">Evidencias en dispositivos personales</text><line x1="536.7" y1="577" x2="550.7" y2="577" stroke="#2E5A88" stroke-width="2"/><text x="556.7" y="582" font-size="14" fill="#1a1a1a">Saldo sin fuente única de verdad</text><line x1="494.2" y1="652" x2="508.2" y2="652" stroke="#2E5A88" stroke-width="2"/><text x="514.2" y="657" font-size="14" fill="#1a1a1a">Datos duplicados en varios archivos</text><line x1="920" y1="430" x2="750" y2="730" stroke="#2E5A88" stroke-width="3"/><rect x="625" y="740" width="250" height="38" rx="6" fill="#D9E2F3" stroke="#1F3864" stroke-width="1.5"/><text x="750" y="765" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle">MEDIO (entorno)</text><line x1="879.2" y1="502" x2="893.2" y2="502" stroke="#2E5A88" stroke-width="2"/><text x="899.2" y="507" font-size="14" fill="#1a1a1a">El crecimiento supera el registro manual</text><line x1="836.7" y1="577" x2="850.7" y2="577" stroke="#2E5A88" stroke-width="2"/><text x="856.7" y="582" font-size="14" fill="#1a1a1a">El cliente espera autoservicio</text><line x1="794.2" y1="652" x2="808.2" y2="652" stroke="#2E5A88" stroke-width="2"/><text x="814.2" y="657" font-size="14" fill="#1a1a1a">Presión de plataformas del mercado</text></svg>