# Despliegue en Render: una base PostgreSQL y un único servicio web que
# entrega la API y el frontend compilado desde la misma dirección.
databases:
  - name: innovasoft-db
    plan: free
    databaseName: innovasoft_helpdesk
    user: innovasoft_app
    postgresMajorVersion: "17"

services:
  - type: web
    name: innovasoft-helpdesk
    runtime: node
    plan: free
    buildCommand: >-
      cd frontend && npm ci && npm run build &&
      cd ../backend && npm ci && npx prisma generate && npm run build
    startCommand: >-
      cd backend && npx prisma migrate deploy && npx prisma db seed &&
      npm run db:demo && node dist/main
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: innovasoft-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: MAX_UPLOAD_MB
        value: "10"
      # Sin servidor de correo, el enlace de verificación se muestra en pantalla.
      - key: MOSTRAR_ENLACES_CORREO
        value: "true"
